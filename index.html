<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebM → MP4 Конвертер (Fix)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #2a2a2a;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { margin-bottom: 24px; font-size: 22px; font-weight: 600; }
        .file-input-wrapper {
            display: block;
            padding: 30px 20px;
            border: 2px dashed #555;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
            background: #222;
        }
        .file-input-wrapper:hover { border-color: #4a9eff; background: #262626; }
        .file-input-wrapper.has-file { border-color: #4a9eff; border-style: solid; }
        input[type="file"] { display: none; }
        .file-name { font-size: 13px; color: #aaa; word-break: break-all; margin-top: 8px; }
        .icon { font-size: 36px; margin-bottom: 10px; }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: #4a9eff;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover:not(:disabled) { background: #3a8eef; }
        button:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }
        .status {
            margin-top: 16px;
            font-size: 13px;
            color: #aaa;
            min-height: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #4a9eff;
            transition: width 0.2s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 WebM → MP4</h1>
        <label class="file-input-wrapper" id="dropZone">
            <div class="icon">📁</div>
            <div>Выберите WebM файл</div>
            <div class="file-name" id="fileName"></div>
            <input type="file" id="fileInput" accept=".webm,video/webm">
        </label>
        <button id="convertBtn" disabled>Экспорт в MP4</button>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status" id="status"></div>
    </div>

    <!-- Используем ES-модули, это более надёжный способ для современных браузеров -->
    <script type="module">
        import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
        import { fetchFile, toBlobURL } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js';

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileName = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        let selectedFile = null;
        let ffmpeg = null;
        let loadingPromise = null;
        let isLoaded = false;

        const coreBaseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';

        function setStatus(message) {
            status.textContent = message;
        }

        function setProgress(progress) {
            const percent = Math.min(100, Math.max(0, progress * 100));
            progressFill.style.width = percent + '%';
        }

        async function loadFFmpeg() {
            if (isLoaded) return;
            if (loadingPromise) return loadingPromise;

            loadingPromise = (async () => {
                setStatus('Загрузка FFmpeg (может занять время)...');
                ffmpeg = new FFmpeg();

                ffmpeg.on('progress', ({ progress }) => {
                    setProgress(progress);
                    setStatus('Конвертация... ' + (progress * 100).toFixed(1) + '%');
                });

                const coreURL = await toBlobURL(coreBaseURL + '/ffmpeg-core.js', 'text/javascript');
                const wasmURL = await toBlobURL(coreBaseURL + '/ffmpeg-core.wasm', 'application/wasm');

                await ffmpeg.load({ coreURL, wasmURL });
                isLoaded = true;
            })();

            try {
                await loadingPromise;
            } catch (error) {
                loadingPromise = null;
                ffmpeg = null;
                throw error;
            }
        }

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            if (!file.name.toLowerCase().endsWith('.webm') && file.type !== 'video/webm') {
                selectedFile = null;
                convertBtn.disabled = true;
                setStatus('Пожалуйста, выберите файл WebM.');
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            dropZone.classList.add('has-file');
            convertBtn.disabled = false;
            setStatus('Готов к конвертации (' + (file.size / 1024 / 1024).toFixed(2) + ' МБ)');
        });

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            convertBtn.disabled = true;
            fileInput.disabled = true;
            progressBar.style.display = 'block';
            setProgress(0);

            const inputName = 'input.webm';
            const outputName = 'output.mp4';

            try {
                await loadFFmpeg();

                setStatus('Чтение файла...');
                await ffmpeg.writeFile(inputName, await fetchFile(selectedFile));

                setStatus('Конвертация...');
                const exitCode = await ffmpeg.exec([
                    '-i', inputName,
                    '-c:v', 'libx264',
                    '-preset', 'ultrafast',
                    '-crf', '23',
                    '-c:a', 'aac',
                    '-b:a', '128k',
                    '-movflags', '+faststart',
                    outputName
                ]);

                if (exitCode !== 0) {
                    throw new Error('FFmpeg завершил конвертацию с кодом ' + exitCode);
                }

                setStatus('Подготовка MP4...');
                const data = await ffmpeg.readFile(outputName);
                const blob = new Blob([data], { type: 'video/mp4' });
                const downloadURL = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = downloadURL;
                link.download = selectedFile.name.replace(/\.webm$/i, '') + '.mp4';
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(downloadURL), 1500);

                setProgress(1);
                setStatus('Готово! MP4 скачивается.');
            } catch (error) {
                console.error('WebM → MP4 conversion failed:', error);
                setStatus('Ошибка: ' + (error && error.message ? error.message : String(error)));
            } finally {
                if (ffmpeg && isLoaded) {
                    try { await ffmpeg.deleteFile(inputName); } catch (_) {}
                    try { await ffmpeg.deleteFile(outputName); } catch (_) {}
                }
                convertBtn.disabled = !selectedFile;
                fileInput.disabled = false;
            }
        });
    </script>
</body>
</html>
